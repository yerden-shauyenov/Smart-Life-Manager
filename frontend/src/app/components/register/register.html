<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">Create Account</h2>

        <form class="mt-8 space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input formControlName="username" type="text"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.errors?.['minlength']" class="text-xs text-red-500 mt-1">
                    Minimum 3 characters required.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input formControlName="email" type="email"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="text-xs text-red-500 mt-1">
                    Please enter a valid email address.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input formControlName="password" type="password"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']" class="text-xs text-red-500 mt-1">
                    Password must be at least 8 characters.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input formControlName="confirmPassword" type="password"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.touched && registerForm.errors?.['mismatch']" class="text-xs text-red-500 mt-1">
                    Passwords do not match.
                </p>
            </div>

            <div *ngIf="error" class="text-sm text-red-600 bg-red-50 p-2 rounded text-center">
                {{ error }}
            </div>

            <button type="submit" [disabled]="registerForm.invalid"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
                {{ registerForm.invalid ? 'Fill all fields correctly' : 'Register' }}
            </button>

            <div class="text-center text-sm">
                <a routerLink="/login" class="text-indigo-600 hover:text-indigo-500 font-medium">
                    Back to login
                </a>
            </div>
        </form>
    </div>
</div>
