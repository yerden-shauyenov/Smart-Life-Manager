<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create your account</h2>
        </div>

        <form class="mt-8 space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username *</label>
                <input type="text" formControlName="username" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid" class="text-red-500 text-xs mt-1">Username is required.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email address *</label>
                <input type="email" formControlName="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['required']" class="text-red-500 text-xs mt-1">Email is required.</p>
                <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="text-red-500 text-xs mt-1">Enter a valid email address.</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" formControlName="first_name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name</label>
                    <input type="text" formControlName="last_name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password *</label>
                <input type="password" formControlName="password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="text-red-500 text-xs mt-1">Password is required.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Confirm Password *</label>
                <input type="password" formControlName="password_confirm" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <p *ngIf="registerForm.get('password_confirm')?.touched && registerForm.get('password_confirm')?.errors?.['required']" class="text-red-500 text-xs mt-1">Please confirm your password.</p>
                <p *ngIf="registerForm.get('password_confirm')?.touched && registerForm.get('password_confirm')?.errors?.['mismatch']" class="text-red-500 text-xs mt-1">Passwords do not match.</p>
            </div>

            <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md text-sm">
                {{ error }}
            </div>

            <div>
                <button type="submit" [disabled]="isLoading" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:opacity-50">
                    {{ isLoading ? 'Registering...' : 'Sign up' }}
                </button>
            </div>

            <div class="text-sm text-center mt-4">
                <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Already have an account? Sign in</a>
            </div>
        </form>
    </div>
</div>
