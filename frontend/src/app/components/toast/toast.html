<div class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2">
    @for (toast of toasts$ | async; track toast.id) {
        <div
                [class]="toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'"
                class="text-white px-6 py-3 rounded-lg shadow-xl flex justify-between items-center min-w-[300px] transition-all duration-300"
        >
            <span class="font-medium">{{ toast.message }}</span>
            <button (click)="remove(toast.id)" class="ml-4 hover:opacity-70 text-lg">&times;</button>
        </div>
    }
</div>
