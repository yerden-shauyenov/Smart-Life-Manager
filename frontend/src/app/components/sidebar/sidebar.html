<aside class="w-64 h-full bg-gray-900 text-white p-6 flex flex-col">
  <h1 class="text-2xl font-bold mb-10 text-blue-400">SmartLife</h1>
  
  <nav class="space-y-2 px-4">
    <button (click)="applyFilter('all')" 
            class="flex items-center w-full px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition-all duration-200 group">
        <span class="mr-3 text-xl group-hover:scale-110 transition-transform">📋</span>
        <span class="font-medium">All Tasks</span>
    </button>

    <div class="pt-4 pb-2">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-4">Eisenhower Matrix</p>
    </div>

    <button (click)="applyFilter('urgent-important')" 
            class="flex items-center w-full px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition-all duration-200 group">
        <span class="mr-3 text-xl group-hover:scale-110 transition-transform">🔥</span>
        <span class="font-medium">Urgent & Important</span>
    </button>

    <button (click)="applyFilter('scheduled')" 
            class="flex items-center w-full px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition-all duration-200 group">
        <span class="mr-3 text-xl group-hover:scale-110 transition-transform">📅</span>
        <span class="font-medium">Scheduled</span>
    </button>

    <button (click)="applyFilter('delegate')" 
            class="flex items-center w-full px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition-all duration-200 group">
        <span class="mr-3 text-xl group-hover:scale-110 transition-transform">👤</span>
        <span class="font-medium">Delegate</span>
    </button>

    <button (click)="applyFilter('eliminate')" 
            class="flex items-center w-full px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition-all duration-200 group">
        <span class="mr-3 text-xl group-hover:scale-110 transition-transform">🗑️</span>
        <span class="font-medium">Eliminate</span>
    </button>
    </nav>

  <div class="mt-auto pt-6 border-t border-gray-800">
    <p class="text-sm text-gray-400">Logged in as: <strong>...</strong></p>
  </div>
</aside>
