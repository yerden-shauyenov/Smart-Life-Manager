<div style="width:250px;background:#1f2937;color:white;height:100vh;display:flex;flex-direction:column;padding:20px;box-sizing:border-box;">

  <!-- Logo (no arrow, just text, click goes to dashboard) -->
  <h1 (click)="goToDashboard()"
    style="font-size:22px;font-weight:800;color:#60a5fa;margin:0 0 28px;cursor:pointer;letter-spacing:-0.5px;">
    SmartLife
  </h1>

  <div style="flex-grow:1;overflow-y:auto;">
    <div style="font-size:11px;text-transform:uppercase;color:#9ca3af;margin-bottom:10px;font-weight:700;padding:0 5px;letter-spacing:0.05em;">
      My Boards
    </div>

    <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;">
      @for (board of boards; track board.id) {
        <li style="display:flex;align-items:center;border-radius:6px;overflow:hidden;"
          [style.backgroundColor]="selectedBoard?.id === board.id ? '#374151' : 'transparent'">

          <!-- Board name -->
          <div (click)="selectBoard(board)"
            style="flex:1;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;">
            <span style="font-size:14px;font-weight:500;">{{ board.title }}</span>
            <span style="font-size:11px;color:#6b7280;">{{ board.is_public ? '🌐 Public' : '🔒 Private' }}</span>
          </div>

        </li>
      }
    </ul>
  </div>

  <!-- Only logout at bottom -->
  <div style="border-top:1px solid #374151;padding-top:16px;">
    <button (click)="logout()"
      style="width:100%;padding:10px;background:#ef4444;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">
      Logout
    </button>
  </div>
</div>
