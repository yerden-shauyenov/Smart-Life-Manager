<div class="fixed lg:static inset-y-0 left-0 z-40 flex flex-col w-64 h-full bg-slate-900 text-slate-300 shadow-xl overflow-hidden transition-transform duration-300 ease-in-out lg:translate-x-0"
     [ngClass]="{ '-translate-x-full': !isOpen }">

    <div class="px-6 py-5 flex items-center justify-between cursor-pointer border-b border-slate-800 hover:bg-slate-800 transition-colors" (click)="goToDashboard()">
        <span class="text-xl font-bold text-white tracking-wide">SmartLife</span>
        <button class="lg:hidden p-1 text-slate-400 hover:text-white transition-colors"
                (click)="$event.stopPropagation(); closeSidebarEvent.emit()" aria-label="Close menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="px-6 pt-6 pb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">
        My Boards
    </div>

    <div class="flex-1 overflow-y-auto px-3 min-h-0">
        <ul class="space-y-1">
            @for (board of boards; track board.id) {
                <li class="rounded-lg overflow-hidden transition-colors" [class.bg-slate-800]="selectedBoard?.id === board.id">
                    <div class="flex flex-col w-full">
                        <div class="flex justify-between items-center w-full cursor-pointer px-3 py-2.5 hover:bg-slate-800 transition-colors rounded-lg text-sm font-medium"
                             [class.text-white]="selectedBoard?.id === board.id"
                             (click)="selectBoard(board)">
                            <span class="truncate">{{ board.title }}</span>
                        </div>

                        @if (selectedBoard?.id === board.id) {
                            <div class="flex flex-col gap-0.5 mb-2 ml-6 border-l border-slate-700 pl-3">
                                <a [routerLink]="['/boards', board.id, 'backlog']"
                                   routerLinkActive="text-indigo-400 font-medium"
                                   class="text-xs text-slate-400 hover:text-indigo-300 transition-colors py-1.5 w-full block">
                                    Backlog
                                </a>
                                <a [routerLink]="['/boards', board.id]"
                                   [routerLinkActiveOptions]="{exact: true}"
                                   routerLinkActive="text-indigo-400 font-medium"
                                   class="text-xs text-slate-400 hover:text-indigo-300 transition-colors py-1.5 w-full block">
                                    Active Sprint
                                </a>
                                <a [routerLink]="['/boards', board.id, 'settings']"
                                   routerLinkActive="text-indigo-400 font-medium"
                                   class="text-xs text-slate-400 hover:text-indigo-300 transition-colors py-1.5 w-full block">
                                    Board Management
                                </a>
                            </div>
                        }
                    </div>
                </li>
            }
        </ul>
    </div>

    <div class="border-t border-slate-800 p-4 bg-slate-900">
        <div (click)="goToProfile()"
            class="flex items-center gap-3 bg-slate-800/50 p-3 rounded-xl cursor-pointer hover:bg-slate-800 transition-all group">

            <img [src]="userAvatar"
                class="w-10 h-10 rounded-full object-cover border border-slate-700 group-hover:border-indigo-500 flex-shrink-0"
                alt="User Avatar">

            <span class="text-sm font-medium text-white flex-1 truncate">{{ username }}</span>

            <button class="text-slate-400 hover:text-red-400 transition-colors p-2 rounded-lg hover:bg-slate-700 flex-shrink-0"
                    (click)="$event.stopPropagation(); logout()"
                    title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
