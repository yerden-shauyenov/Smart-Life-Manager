<div class="flex justify-center items-center h-screen bg-gray-900">
    <div class="bg-gray-800 p-10 rounded-2xl w-full max-w-md shadow-2xl border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">AgileBoard</h1>
            <p class="text-gray-400 text-sm">Enter your credentials to continue</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Username</label>
                <input
                        type="text"
                        [(ngModel)]="credentials.username"
                        name="username"
                        required
                        class="w-full p-3 rounded-lg border border-gray-600 bg-gray-900 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                        placeholder="admin"
                >
            </div>

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Password</label>
                <input
                        type="password"
                        [(ngModel)]="credentials.password"
                        name="password"
                        required
                        class="w-full p-3 rounded-lg border border-gray-600 bg-gray-900 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                        placeholder="••••••••"
                >
            </div>

            @if (errorMessage) {
                <div class="bg-red-900/30 text-red-400 p-3 rounded-lg text-sm text-center border border-red-800">
                    {{ errorMessage }}
                </div>
            }

            <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98]">
                Sign In
            </button>
        </form>
    </div>
</div>
