<div class="h-full bg-gray-900 text-white p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Active Sprint</h2>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium transition-colors">
            Create Task
        </button>
    </div>

    <div class="flex gap-6 h-[calc(100vh-120px)] overflow-x-auto pb-4">

        <div class="bg-gray-800 rounded-lg w-80 flex-shrink-0 flex flex-col">
            <div class="p-3 border-b border-gray-700">
                <h3 class="font-semibold text-gray-300">To Do</h3>
            </div>
            <div class="p-3 flex-1 overflow-y-auto space-y-3">
                @for (task of tasks; track task.id) {
                    <div class="bg-gray-700 p-4 rounded-md shadow hover:ring-2 hover:ring-blue-500 cursor-pointer transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-medium px-2 py-1 rounded bg-gray-600 text-gray-300">{{ task.type_name }}</span>
                            <span class="text-xs font-bold text-red-400">{{ task.priority_name }}</span>
                        </div>
                        <h4 class="font-medium mb-2">{{ task.title }}</h4>
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span>{{ task.assignee_username || 'Unassigned' }}</span>
                        </div>
                    </div>
                }
            </div>
        </div>

    </div>
</div>
