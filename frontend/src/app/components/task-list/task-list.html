<section class="p-8 bg-gray-50 min-h-screen">
  <header class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold text-gray-800">My Productivity Board</h2>
    <button (click)="toggleModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
      + New Task
    </button>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (task of tasks$ | async; track task.id) {
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4" 
           [ngClass]="{
             'border-red-500': task.priority === 'high',
             'border-yellow-500': task.priority === 'medium',
             'border-blue-500': task.priority === 'low'
           }">
        <div class="flex justify-between items-start mb-4">
          <span class="text-xs font-semibold px-2 py-1 bg-gray-100 rounded text-gray-600 uppercase">
            {{ task.type.replace('-', ' ') }}
          </span>
          <input type="checkbox" [checked]="task.isCompleted" (change)="onToggle(task.id)" class="w-5 h-5 rounded text-blue-600">
        </div>
        
        <h3 class="text-lg font-bold text-gray-900 mb-2">{{ task.title }}</h3>
        <p class="text-gray-600 text-sm mb-4">{{ task.description }}</p>
        
        <div class="flex items-center text-xs text-gray-400 italic">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Due: {{ task.dueDate | date }}
        </div>
      </div>
    }
  </div>
</section>

@if (showModal) {
  <div class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex justify-center items-center z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h3 class="text-xl font-bold mb-6 text-gray-900">Create New Task</h3>
      
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Task Title</label>
            <input formControlName="title" type="text" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea formControlName="description" rows="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
            <label class="block text-sm font-medium text-gray-700">Priority (Color)</label>
            <select formControlName="priority" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                <option value="low">Low (Blue)</option>
                <option value="medium">Medium (Yellow)</option>
                <option value="high">High (Red)</option>
            </select>
            </div>

            <div>
            <label class="block text-sm font-medium text-gray-700">Category</label>
            <select formControlName="type" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                <option value="urgent-important">Urgent & Important</option>
                <option value="scheduled">Scheduled (Not Urgent)</option>
                <option value="delegate">Delegate</option>
                <option value="eliminate">Eliminate</option>
            </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Due Date</label>
            <input formControlName="dueDate" type="date" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>

        <div class="flex justify-end space-x-3 mt-6">
            <button type="button" (click)="toggleModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
            <button type="submit" [disabled]="taskForm.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
            Save Task
            </button>
        </div>
        </form>
    </div>
  </div>
}
