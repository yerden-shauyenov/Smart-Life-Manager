<div style="padding: 20px;">
    <h2 style="margin-bottom: 20px;">{{ currentBoard?.title || 'Loading...' }}</h2>

    <div style="display: flex; gap: 20px; overflow-x: auto;">
        @for (status of statuses; track status.id) {
            <div style="background: #ebecf0; border-radius: 8px; width: 300px; padding: 10px; min-height: 400px;">
                <h3 style="font-size: 14px; text-transform: uppercase; color: #5e6c84;">{{ status.name }}</h3>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    @for (task of getTasksByStatus(status.id); track task.id) {
                        <div style="background: white; padding: 10px; border-radius: 4px; box-shadow: 0 1px 0 rgba(9,30,66,.25);">
                            <div style="font-weight: 500; margin-bottom: 10px;">{{ task.title }}</div>

                            <select
                                    style="width: 100%; font-size: 12px;"
                                    (change)="moveTask(task, +$any($event.target).value)">
                                <option [value]="status.id">Change status...</option>
                                @for (s of statuses; track s.id) {
                                    @if (s.id !== status.id) {
                                        <option [value]="s.id">{{ s.name }}</option>
                                    }
                                }
                            </select>
                        </div>
                    }
                </div>
            </div>
        }
    </div>
</div>
