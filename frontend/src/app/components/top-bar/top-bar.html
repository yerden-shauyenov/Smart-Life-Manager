<nav class="bg-white border-b border-slate-200 w-full px-4 py-3 flex items-center gap-3 shadow-sm z-10 relative">
    <button class="lg:hidden p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
            (click)="menuToggle.emit()" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <a routerLink="/dashboard" class="text-xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors tracking-wide">
        SmartLife
    </a>

    <div class="ml-auto flex items-center gap-2" *ngIf="currentUser">
        <div (click)="goToProfile()"
             class="flex items-center gap-2 px-3 py-1.5 rounded-xl cursor-pointer hover:bg-slate-100 transition-all group">
            <img [src]="userAvatar"
                 class="w-8 h-8 rounded-full object-cover border border-slate-200 group-hover:border-indigo-400 flex-shrink-0"
                 alt="User Avatar">
            <span class="text-sm font-medium text-slate-700 hidden sm:block">{{ username }}</span>
        </div>

        <button (click)="logout()"
                title="Logout"
                class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
    </div>
</nav>
