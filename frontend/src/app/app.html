<div class="h-screen w-screen flex flex-col overflow-hidden bg-white dark:bg-slate-950 transition-colors">
    @if (!(isAuthPage$ | async)) {
        <app-top-bar *ngIf="showSidebar" (menuToggle)="toggleSidebar()"></app-top-bar>
    }

    <div class="flex flex-1 overflow-hidden">
        @if (!(isAuthPage$ | async)) {
            <div *ngIf="showSidebar && sidebarOpen"
                 class="fixed inset-0 bg-black/50 z-30 lg:hidden"
                 (click)="closeSidebar()">
            </div>
            <app-sidebar *ngIf="showSidebar"
                         [isOpen]="sidebarOpen"
                         (closeSidebarEvent)="closeSidebar()">
            </app-sidebar>
        }

        <main class="flex-1 overflow-y-auto bg-white dark:bg-slate-950 transition-colors relative">
            <router-outlet></router-outlet>
            <app-confirm-dialog></app-confirm-dialog>
            <app-toast></app-toast>
        </main>
    </div>

    @if (loadingService.isLoading()) {
        <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm pointer-events-auto animate-[fade-in_0.2s_ease-out]">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    }
</div>
